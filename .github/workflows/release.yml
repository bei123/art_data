name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  NODE_VERSION: '24'

jobs:
  build-and-release:
    name: Build and publish release assets
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm run test
        env:
          NODE_ENV: test
          DB_PASSWORD: ci-test-db-password
          JWT_SECRET: ci-test-jwt-secret-key-at-least-32-characters

      - name: Production build
        run: npm run build
        env:
          NODE_ENV: production

      - name: Create release archive
        run: |
          tar -czf art-data-admin-dist.tar.gz dist/
          zip -r art-data-admin-dist.zip dist/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: |
            art-data-admin-dist.tar.gz
            art-data-admin-dist.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
