name: Scheduled Audit

on:
  schedule:
    - cron: '0 2 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

env:
  NODE_VERSION: '20'

jobs:
  weekly-audit:
    name: Weekly security and OpenAPI audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: OpenAPI route audit
        run: npm run audit:openapi
        continue-on-error: true

      - name: npm audit
        run: npm audit --audit-level=moderate
        continue-on-error: true

      - name: Full CI smoke
        run: npm run ci
