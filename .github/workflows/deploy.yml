name: Deploy Production

on:
  push:
    branches: [main, master]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - '.github/dependabot.yml'
  workflow_dispatch:
    inputs:
      ref:
        description: 'Deploy or rollback to a commit SHA or tag (empty = current SHA)'
        required: false
        default: ''
      force_full:
        description: 'Force full deploy (build + restart) even if no FE/BE code changes'
        required: false
        type: boolean
        default: true

permissions:
  contents: read
  packages: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  NODE_VERSION: '24'

jobs:
  deploy:
    name: Deploy to Baota
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 0

      - name: Detect frontend / backend changes
        id: changes
        shell: bash
        run: |
          set -euo pipefail

          # workflow_dispatch 默认全量；取消 force_full 时按相对上一次提交的 diff 判断
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.force_full }}" != "false" ]; then
            echo "Manual full deploy"
            echo "frontend=true" >> "$GITHUB_OUTPUT"
            echo "backend=true" >> "$GITHUB_OUTPUT"
            echo "mode=full" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          AFTER="$(git rev-parse HEAD)"
          BEFORE=""
          if [ "${{ github.event_name }}" = "push" ]; then
            BEFORE="${{ github.event.before }}"
          fi
          if [ -z "$BEFORE" ] || [[ "$BEFORE" =~ ^0+$ ]]; then
            BEFORE="$(git rev-parse "${AFTER}^" 2>/dev/null || true)"
          fi

          if [ -z "$BEFORE" ] || [[ "$BEFORE" =~ ^0+$ ]]; then
            echo "No usable before SHA, default to full deploy"
            echo "frontend=true" >> "$GITHUB_OUTPUT"
            echo "backend=true" >> "$GITHUB_OUTPUT"
            echo "mode=full" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          mapfile -t FILES < <(git diff --name-only "$BEFORE" "$AFTER" || true)
          echo "Diff $BEFORE..$AFTER (${#FILES[@]} files)"
          printf '  %s\n' "${FILES[@]:-}"

          frontend=false
          backend=false

          is_frontend() {
            case "$1" in
              src/*|public/*|index.html|vite.config.js|components.json|tsconfig.json|favicon.ico)
                return 0 ;;
              package.json|package-lock.json)
                return 0 ;;
              *)
                return 1 ;;
            esac
          }

          is_backend() {
            case "$1" in
              index.js|auth.js|db.js|schema.sql|.nvmrc|.env.production.example)
                return 0 ;;
              routes/*|services/*|middleware/*|utils/*|config/*|sql/*|scripts/*)
                return 0 ;;
              package.json|package-lock.json)
                return 0 ;;
              *)
                return 1 ;;
            esac
          }

          for f in "${FILES[@]:-}"; do
            [ -z "$f" ] && continue
            if is_frontend "$f"; then frontend=true; fi
            if is_backend "$f"; then backend=true; fi
          done

          if [ "$frontend" = "true" ] && [ "$backend" = "true" ]; then
            mode=full
          elif [ "$frontend" = "true" ]; then
            mode=frontend
          elif [ "$backend" = "true" ]; then
            mode=backend
          else
            mode=pull-only
          fi

          echo "frontend=$frontend" >> "$GITHUB_OUTPUT"
          echo "backend=$backend" >> "$GITHUB_OUTPUT"
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "Deploy mode=$mode frontend=$frontend backend=$backend"

      - name: Setup Node.js
        if: steps.changes.outputs.frontend == 'true' || steps.changes.outputs.backend == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        if: steps.changes.outputs.frontend == 'true' || steps.changes.outputs.backend == 'true'
        run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Test
        if: steps.changes.outputs.frontend == 'true' || steps.changes.outputs.backend == 'true'
        run: npm run test
        env:
          NODE_ENV: test
          DB_PASSWORD: ci-test-db-password
          JWT_SECRET: ci-test-jwt-secret-key-at-least-32-characters
          OSS_ACCESS_KEY_ID: ci-test-oss-access-key-id
          OSS_ACCESS_KEY_SECRET: ci-test-oss-access-key-secret
          OSS_BUCKET: ci-test-bucket
          OSS_REGION: oss-cn-hangzhou
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build admin frontend
        if: steps.changes.outputs.frontend == 'true'
        run: npm run build
        env:
          NODE_ENV: production
          VITE_PUBLIC_API_BASE_URL: ${{ vars.VITE_PUBLIC_API_BASE_URL || 'https://api.wx.2000gallery.art' }}
          VITE_OSS_PUBLIC_ORIGIN: ${{ vars.VITE_OSS_PUBLIC_ORIGIN || 'https://wx.oss.2000gallery.art' }}
          VITE_API_SIGN_KEY: ${{ vars.VITE_API_SIGN_KEY || 'admin-web' }}
          VITE_API_SIGN_SECRET: ${{ secrets.VITE_API_SIGN_SECRET }}

      - name: Setup SSH for rsync
        if: steps.changes.outputs.frontend == 'true'
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}

      - name: Deploy admin static
        if: steps.changes.outputs.frontend == 'true'
        run: |
          rsync -avzr --delete \
            --chmod=Du=rwx,Dgo=rx,Fu=rw,Fgo=r \
            --exclude='.user.ini' \
            --filter='protect .user.ini' \
            -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes" \
            dist/ \
            "${SSH_USER}@${SSH_HOST}:${ADMIN_DEPLOY_PATH}"
        env:
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          ADMIN_DEPLOY_PATH: ${{ vars.ADMIN_DEPLOY_PATH || '/www/wwwroot/wx.ht.2000gallery.art/' }}

      - name: Sync backend on server
        uses: appleboy/ssh-action@v1.2.5
        env:
          NEED_BACKEND_RESTART: ${{ steps.changes.outputs.backend }}
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          timeout: 60s
          command_timeout: 30m
          envs: NEED_BACKEND_RESTART,NODE_AUTH_TOKEN
          script: |
            set -euo pipefail
            BACKEND="${{ vars.BACKEND_DEPLOY_PATH || '/www/wwwroot/art_data' }}"
            cd "$BACKEND"
            git fetch origin main
            git reset --hard origin/main
            echo "==> Server repo synced to $(git rev-parse --short HEAD)"

            if [ "${NEED_BACKEND_RESTART}" = "true" ]; then
              chmod +x deploy/*.sh
              # NODE_AUTH_TOKEN enables @bei123/* installs from GitHub Packages
              bash deploy/install-backend-deps.sh "$BACKEND"
              BT_NODE_PROJECT_NAME=${{ vars.BT_NODE_PROJECT_NAME || 'art_data' }} bash deploy/restart-baota-node.sh
            else
              echo "==> No backend runtime change, skip npm ci / Baota restart"
            fi

      - name: Wait for API
        if: steps.changes.outputs.backend == 'true'
        run: sleep 5

      - name: Smoke test
        if: steps.changes.outputs.frontend == 'true' || steps.changes.outputs.backend == 'true'
        run: bash deploy/smoke-test.sh
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL || 'https://api.wx.2000gallery.art' }}
          ADMIN_BASE_URL: ${{ vars.ADMIN_BASE_URL || 'https://wx.ht.2000gallery.art' }}

      - name: Nginx reload via Baota API
        if: success() && (steps.changes.outputs.frontend == 'true' || steps.changes.outputs.backend == 'true')
        continue-on-error: true
        run: node deploy/bt-api-call.mjs
        env:
          BT_PANEL_URL: ${{ secrets.BT_PANEL_URL }}
          BT_API_KEY: ${{ secrets.BT_API_KEY }}
          BT_API_ACTION: ServiceAdmin
          BT_API_PARAMS: '{"name":"nginx","type":"reload"}'

      - name: Notify deploy result
        if: always()
        continue-on-error: true
        run: node deploy/notify-deploy.mjs
        env:
          DEPLOY_STATUS: ${{ job.status }}
          DEPLOY_PROJECT: art_data
          DEPLOY_VERSION: ${{ steps.changes.outputs.mode }}
          WECOM_WEBHOOK_URL: ${{ secrets.WECOM_WEBHOOK_URL }}
          DEPLOY_NOTIFY_WEBHOOK_URL: ${{ secrets.DEPLOY_NOTIFY_WEBHOOK_URL }}
          WECHAT_OA_APPID: ${{ secrets.WECHAT_OA_APPID }}
          WECHAT_OA_SECRET: ${{ secrets.WECHAT_OA_SECRET }}
          WECHAT_OA_TEMPLATE_ID: ${{ secrets.WECHAT_OA_TEMPLATE_ID }}
          WECHAT_OA_TOUSER: ${{ secrets.WECHAT_OA_TOUSER }}
          WECHAT_OA_TEMPLATE_DATA_JSON: ${{ secrets.WECHAT_OA_TEMPLATE_DATA_JSON }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_SERVER_URL: ${{ github.server_url }}
          GITHUB_WORKFLOW: ${{ github.workflow }}
