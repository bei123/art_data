name: Deploy Production

on:
  push:
    branches: [main, master]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - '.github/dependabot.yml'
  workflow_dispatch:
    inputs:
      ref:
        description: 'Deploy or rollback to a commit SHA or tag (empty = current SHA)'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  NODE_VERSION: '24'

jobs:
  deploy:
    name: Deploy to Baota
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm run test
        env:
          NODE_ENV: test
          DB_PASSWORD: ci-test-db-password
          JWT_SECRET: ci-test-jwt-secret-key-at-least-32-characters
          OSS_ACCESS_KEY_ID: ci-test-oss-access-key-id
          OSS_ACCESS_KEY_SECRET: ci-test-oss-access-key-secret
          OSS_BUCKET: ci-test-bucket
          OSS_REGION: oss-cn-hangzhou

      - name: Build admin frontend
        run: npm run build
        env:
          NODE_ENV: production
          VITE_PUBLIC_API_BASE_URL: ${{ vars.VITE_PUBLIC_API_BASE_URL || 'https://api.wx.2000gallery.art' }}
          VITE_OSS_PUBLIC_ORIGIN: ${{ vars.VITE_OSS_PUBLIC_ORIGIN || 'https://wx.oss.2000gallery.art' }}
          VITE_API_SIGN_KEY: ${{ vars.VITE_API_SIGN_KEY || 'admin-web' }}
          VITE_API_SIGN_SECRET: ${{ secrets.VITE_API_SIGN_SECRET }}

      - name: Setup SSH for rsync
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}

      - name: Deploy admin static
        run: |
          rsync -avzr --delete \
            --chmod=Du=rwx,Dgo=rx,Fu=rw,Fgo=r \
            --exclude='.user.ini' \
            --filter='protect .user.ini' \
            -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes" \
            dist/ \
            "${SSH_USER}@${SSH_HOST}:${ADMIN_DEPLOY_PATH}"
        env:
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          ADMIN_DEPLOY_PATH: ${{ vars.ADMIN_DEPLOY_PATH || '/www/wwwroot/wx.ht.2000gallery.art/' }}

      - name: Deploy backend
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          timeout: 60s
          command_timeout: 30m
          script_stop: true
          script: |
            set -euo pipefail
            BACKEND="${{ vars.BACKEND_DEPLOY_PATH || '/www/wwwroot/art_data' }}"
            cd "$BACKEND"
            git fetch origin main
            git reset --hard origin/main
            chmod +x deploy/*.sh
            bash deploy/install-backend-deps.sh "$BACKEND"
            BT_NODE_PROJECT_NAME=${{ vars.BT_NODE_PROJECT_NAME || 'art_data' }} bash deploy/restart-baota-node.sh

      - name: Wait for API
        run: sleep 5

      - name: Smoke test
        run: bash deploy/smoke-test.sh
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL || 'https://api.wx.2000gallery.art' }}
          ADMIN_BASE_URL: ${{ vars.ADMIN_BASE_URL || 'https://wx.ht.2000gallery.art' }}

      - name: Nginx reload via Baota API
        if: success()
        continue-on-error: true
        run: node deploy/bt-api-call.mjs
        env:
          BT_PANEL_URL: ${{ secrets.BT_PANEL_URL }}
          BT_API_KEY: ${{ secrets.BT_API_KEY }}
          BT_API_ACTION: ServiceAdmin
          BT_API_PARAMS: '{"name":"nginx","type":"reload"}'

      - name: Notify deploy result
        if: always()
        continue-on-error: true
        run: node deploy/notify-deploy.mjs
        env:
          DEPLOY_STATUS: ${{ job.status }}
          DEPLOY_PROJECT: art_data
          WECOM_WEBHOOK_URL: ${{ secrets.WECOM_WEBHOOK_URL }}
          DEPLOY_NOTIFY_WEBHOOK_URL: ${{ secrets.DEPLOY_NOTIFY_WEBHOOK_URL }}
          WECHAT_OA_APPID: ${{ secrets.WECHAT_OA_APPID }}
          WECHAT_OA_SECRET: ${{ secrets.WECHAT_OA_SECRET }}
          WECHAT_OA_TEMPLATE_ID: ${{ secrets.WECHAT_OA_TEMPLATE_ID }}
          WECHAT_OA_TOUSER: ${{ secrets.WECHAT_OA_TOUSER }}
          WECHAT_OA_TEMPLATE_DATA_JSON: ${{ secrets.WECHAT_OA_TEMPLATE_DATA_JSON }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_SERVER_URL: ${{ github.server_url }}
          GITHUB_WORKFLOW: ${{ github.workflow }}
